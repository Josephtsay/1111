AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  1111 Unified Search API — no-graph (BM25+kNN) + graph (skill-boost) backends.
  公開存取，無需 API key。

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 1024
    Architectures:
      - x86_64

Parameters:
  AwsRegion:
    Type: String
    Default: us-west-2
  BedrockEmbedModelId:
    Type: String
    Default: "global.cohere.embed-v4:0"
  EmbedDim:
    Type: String
    Default: "1536"
  OpenSearchEndpoint:
    Type: String
    Default: "https://search-job-search-dev-v2-6jrkprxjsfomraf3yr6vemb5u4.us-west-2.es.amazonaws.com"
  OpenSearchIndex:
    Type: String
    Default: "jobs-search-dev-v2"
  OpenSearchAuth:
    Type: String
    Default: basic
  OpenSearchUsername:
    Type: String
    Default: "Tsai"
  OpenSearchPassword:
    Type: String
    Default: ""
    NoEcho: true
  OpenSearchService:
    Type: String
    Default: es
  OpenSearchVerifyCerts:
    Type: String
    Default: "true"

Resources:
  UnifiedSearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_handler.handler
      CodeUri: deploy/
      Description: "Unified Search API — no-graph + graph backends (FastAPI + Mangum)"
      Environment:
        Variables:
          AWS_REGION_NAME: !Ref AwsRegion
          BEDROCK_EMBED_MODEL_ID: !Ref BedrockEmbedModelId
          EMBED_DIM: !Ref EmbedDim
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
          OPENSEARCH_INDEX: !Ref OpenSearchIndex
          OPENSEARCH_AUTH: !Ref OpenSearchAuth
          OPENSEARCH_USERNAME: !Ref OpenSearchUsername
          OPENSEARCH_PASSWORD: !Ref OpenSearchPassword
          OPENSEARCH_SERVICE: !Ref OpenSearchService
          OPENSEARCH_VERIFY_CERTS: !Ref OpenSearchVerifyCerts
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        SearchApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref SearchHttpApi

  SearchHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: "$default"
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - "*"

Outputs:
  ApiUrl:
    Description: "公開 API URL"
    Value: !Sub "https://${SearchHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  FunctionArn:
    Description: "Lambda ARN"
    Value: !GetAtt UnifiedSearchFunction.Arn
